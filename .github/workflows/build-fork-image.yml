name: Build fork image (GHCR)

# Personal fork only: build `main` into ghcr.io/<owner>/calibre-web-automated
# so docker-compose can pull a fixed image without waiting for an upstream
# release. Upstream builds to Docker Hub from its own release branches, which
# this workflow intentionally does not touch.

on:
  push:
    branches: [main]
    paths:
      - 'cps/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'optional-requirements.txt'
      - '.github/workflows/build-fork-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/calibre-web-automated:latest
            ghcr.io/${{ github.repository_owner }}/calibre-web-automated:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=4.0.8-fork
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
